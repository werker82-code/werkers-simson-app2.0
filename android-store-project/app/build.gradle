plugins { id 'com.android.application' }

def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def ksPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def ksAlias = System.getenv("ANDROID_KEY_ALIAS")
def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = ksPath && ksPassword && ksAlias && keyPasswordValue

android {
    namespace = 'com.werkerswerkstatt.simson'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.werkerswerkstatt.simson'
        minSdk = 24
        targetSdk = 36
        versionCode = 50001
        versionName = '5.0.1'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            debuggable true
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
}
