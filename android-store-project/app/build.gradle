plugins { id 'com.android.application' }

def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def ksPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def ksAlias = System.getenv("ANDROID_KEY_ALIAS")
def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = ksPath && ksPassword && ksAlias && keyPasswordValue

android {
    namespace = 'com.werkers_werkstatt.meineapp'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.werkers_werkstatt.meineapp'
        minSdk = 24
        targetSdk = 36
        versionCode = 41200
        versionName = '4.12.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
}
