name: iOS TestFlight Build

on:
  push:
    branches:
      - ios-appstore-1.0-build2
      - release-5.0.1
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App-Store-Version
        required: true
        default: '1.0'
      build_number:
        description: Eindeutige iOS-Buildnummer
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      APP_ID: com.werkerswerkstatt.simson
      APP_NAME: Werkers Simson
      TEAM_ID: TYJS76T49A
      IOS_MARKETING_VERSION: ${{ inputs.marketing_version || '1.0' }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number || '3' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Gemeinsamen App-Stand 5.0.1 vorbereiten
        run: |
          set -euo pipefail
          RELEASE_PARTS="$GITHUB_WORKSPACE/.release/werkers-simson-5.0.1-build50001"
          RELEASE_ZIP="$RUNNER_TEMP/werkers-simson-5.0.1-build50001-android-project.zip"
          test -d "$RELEASE_PARTS"
          : > "$RELEASE_ZIP"
          for RELEASE_PART in "$RELEASE_PARTS"/part-*.b64; do
            base64 --decode "$RELEASE_PART" >> "$RELEASE_ZIP"
          done
          echo "8dbc31ad1cd4fad1b27ab206e8bf2e14b57163f54bce740f86f37479cc6fdb27  $RELEASE_ZIP" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/mobile-release"
          unzip -q "$RELEASE_ZIP" -d "$RUNNER_TEMP/mobile-release"
          test -f "$RUNNER_TEMP/mobile-release/android-store-project/app/src/main/assets/index.html"
          rm -rf "$GITHUB_WORKSPACE/www"
          cp -R "$RUNNER_TEMP/mobile-release/android-store-project/app/src/main/assets" "$GITHUB_WORKSPACE/www"
          grep -Fq '"version":"5.0.1"' "$GITHUB_WORKSPACE/www/version.js"
          grep -Fq "let viewMode = 'hd'" "$GITHUB_WORKSPACE/www/configurator3d.js"
          grep -Fq 'DETAILLIERTES HD-MODELL' "$GITHUB_WORKSPACE/www/configurator3d.js"

      - name: App-Store-Version prüfen
        run: |
          [[ "$IOS_MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "App Store version: $IOS_MARKETING_VERSION"
          echo "iOS build: $IOS_BUILD_NUMBER"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Create fresh iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Apply App Store settings
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

          # App Store icons must be fully opaque. Convert through JPEG to
          # guarantee that the final PNG contains no alpha/transparency channel.
          if [ -f "www/assets/icon-512.png" ]; then
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            sips -z 1024 1024 -s format jpeg -s formatOptions 100 \
              www/assets/icon-512.png --out "$RUNNER_TEMP/AppIcon-opaque.jpg"
            sips -s format png \
              "$RUNNER_TEMP/AppIcon-opaque.jpg" \
              --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
            echo "Final App Store icon properties:"
            sips -g pixelWidth -g pixelHeight -g hasAlpha \
              ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          fi

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" || (echo "Missing secret ASC_KEY_ID" && exit 1)
          test -n "$ASC_ISSUER_ID" || (echo "Missing secret ASC_ISSUER_ID" && exit 1)
          test -n "$ASC_KEY_P8" || (echo "Missing secret ASC_KEY_P8" && exit 1)

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WerkersSimson.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_ID" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | tee "$RUNNER_TEMP/archive.log"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>TYJS76T49A</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA with App Store signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/WerkersSimson.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Werkers-Simson-iOS-v${{ env.IOS_MARKETING_VERSION }}-build-${{ env.IOS_BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          shopt -s nullglob
          IPA_FILES=("$RUNNER_TEMP"/export/*.ipa)
          if [ ${#IPA_FILES[@]} -ne 1 ]; then
            echo "Expected exactly one IPA, found ${#IPA_FILES[@]}"
            ls -la "$RUNNER_TEMP/export" || true
            exit 1
          fi
          IPA="${IPA_FILES[0]}"
          echo "Uploading: $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
