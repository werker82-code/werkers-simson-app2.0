name: Build Werkers Simson Android

on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Signierte Store-Version bauen? false = installierbare Beta-APK"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Aktuelles Web-Bundle und Version vorbereiten
        run: python3 scripts/prepare_release.py --android

      - name: Build-Quelle auf aktuellen Stand prüfen
        run: |
          test -f android-store-project/app/src/main/assets/version.js
          test -f android-store-project/app/src/main/assets/configurator3d.js
          test -f android-store-project/app/src/main/assets/assets/models/manifest.json
          grep -q 'version.js' android-store-project/app/src/main/assets/index.html
          grep -q '4.5.0' android-store-project/app/src/main/assets/version.js
          grep -q 'GLB 4.5' android-store-project/app/src/main/assets/configurator3d.js
          grep -q 'versionCode = 4501' android-store-project/app/build.gradle
          echo "Android-Bundle: V${APP_VERSION} · Build ${APP_BUILD} · ${RENDERER_VERSION}"

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android API 36 installieren
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Keystore vorbereiten
        if: ${{ inputs.signed }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Es fehlen Signatur-Secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/werkers-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/werkers-upload-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Signierte Store-Version bauen
        if: ${{ inputs.signed }}
        working-directory: android-store-project
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Installierbare Beta-APK bauen
        if: ${{ !inputs.signed }}
        working-directory: android-store-project
        run: gradle --no-daemon clean assembleDebug

      - name: AAB für Google Play hochladen
        if: ${{ inputs.signed }}
        uses: actions/upload-artifact@v4
        with:
          name: werkers-simson-v${{ env.APP_VERSION }}-b${{ env.APP_BUILD }}-SIGNED-aab
          path: android-store-project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Signierte APK hochladen
        if: ${{ inputs.signed }}
        uses: actions/upload-artifact@v4
        with:
          name: werkers-simson-v${{ env.APP_VERSION }}-b${{ env.APP_BUILD }}-SIGNED-apk
          path: android-store-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Beta-APK als Artifact sichern
        if: ${{ !inputs.signed }}
        uses: actions/upload-artifact@v4
        with:
          name: werkers-simson-v${{ env.APP_VERSION }}-b${{ env.APP_BUILD }}-BETA-apk
          path: android-store-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Beta-APK direkt unter Releases veröffentlichen
        if: ${{ !inputs.signed }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SRC=$(find android-store-project/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$SRC"
          OUT="Werkers-Simson-v${APP_VERSION}-b${APP_BUILD}-BETA.apk"
          cp "$SRC" "$OUT"
          TAG="beta-v${APP_VERSION}-b${APP_BUILD}"
          TITLE="Werkers Simson Beta v${APP_VERSION} · Build ${APP_BUILD}"
          NOTES="Installierbare Android-Beta mit ${RENDERER_VERSION}. Paket-ID der Beta: com.werkerswerkstatt.simson.beta."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" "$OUT" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
