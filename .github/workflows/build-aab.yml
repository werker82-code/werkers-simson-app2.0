name: Build Werkers Simson 5.0.1 Android AAB

on:
  push:
    branches:
      - release-5.0.1
    paths:
      - '.release/werkers-simson-5.0.1-build50001/**'
      - '.github/workflows/build-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Android-Projekt 5.0.1 Build 50001 entpacken
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_PARTS="$GITHUB_WORKSPACE/.release/werkers-simson-5.0.1-build50001"
          ANDROID_ZIP="$RUNNER_TEMP/werkers-simson-5.0.1-build50001-android-project.zip"
          test -d "$RELEASE_PARTS" || {
            echo "::error::Die Release-Teildateien fehlen."
            exit 1
          }
          cat "$RELEASE_PARTS"/part-*.b64 | base64 --decode > "$ANDROID_ZIP"
          echo "8dbc31ad1cd4fad1b27ab206e8bf2e14b57163f54bce740f86f37479cc6fdb27  $ANDROID_ZIP" | sha256sum --check

          mkdir -p "$GITHUB_WORKSPACE/mobile-build"
          unzip -q "$ANDROID_ZIP" -d "$GITHUB_WORKSPACE/mobile-build"
          echo "ANDROID_PROJECT=$GITHUB_WORKSPACE/mobile-build/android-store-project" >> "$GITHUB_ENV"

      - name: Release-Inhalt prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_PROJECT/app/build.gradle"
          test -f "$ANDROID_PROJECT/app/src/main/assets/configurator3d.js"
          test -f "$ANDROID_PROJECT/app/src/main/assets/version.js"
          grep -Fq "versionCode = 50001" "$ANDROID_PROJECT/app/build.gradle"
          grep -Fq "versionName = '5.0.1'" "$ANDROID_PROJECT/app/build.gradle"
          grep -Fq '"build":50001' "$ANDROID_PROJECT/app/src/main/assets/version.js"
          grep -Fq "let viewMode = 'hd'" "$ANDROID_PROJECT/app/src/main/assets/configurator3d.js"
          grep -Fq 'DETAILLIERTES HD-MODELL' "$ANDROID_PROJECT/app/src/main/assets/configurator3d.js"
          grep -Fq "safe-area-inset-top" "$ANDROID_PROJECT/app/src/main/assets/style.css"
          grep -Fq "setDecorFitsSystemWindows(false)" "$ANDROID_PROJECT/app/src/main/java/com/werkerswerkstatt/simson/MainActivity.java"
          test "$(find "$ANDROID_PROJECT/app/src/main/assets/assets/models/hd" -maxdepth 1 -name '*.glb' | wc -l)" -eq 45

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13 einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android API 36 installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Google-Play-Upload-Key vorbereiten
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Mindestens eines der vier Android-Signatur-Secrets fehlt."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/werkers-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/werkers-upload-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Signiertes Google-Play-AAB bauen
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: gradle --no-daemon clean bundleRelease

      - name: AAB prüfen
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find "$ANDROID_PROJECT/app/build/outputs/bundle/release" -maxdepth 1 -name '*.aab' -print -quit)
          test -n "$AAB"
          test -s "$AAB"
          echo "AAB erfolgreich erstellt: $AAB"

      - name: AAB zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Werkers-Simson-5.0.1-build50001-SIGNED-AAB
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
