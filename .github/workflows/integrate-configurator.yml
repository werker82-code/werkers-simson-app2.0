name: Integrate S51 Configurator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Integrate configurator
        run: python3 scripts/integrate_configurator.py

      - name: Verify integration
        run: |
          grep -q 'id="configurator"' index.html
          grep -q 'configurator.js' index.html
          grep -q 'configurator.css' index.html
          grep -q 'id="configurator"' www/index.html
          grep -q 'configurator.js' www/index.html
          grep -q 'configurator.css' www/index.html
          echo "Configurator integration verified"

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html www/index.html sw.js www/sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Wire S51 configurator into app"
            git push
          fi
