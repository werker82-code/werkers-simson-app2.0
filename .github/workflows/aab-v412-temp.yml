name: Temporary V4.12.0 AAB Build

on:
  push:
    branches:
      - aab-v412-temp

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Android API 36 installieren
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unsigned AAB bauen
        working-directory: android-store-project
        run: gradle --no-daemon clean bundleRelease

      - name: Bundletool herunterladen
        run: |
          curl -L --fail --retry 3 -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          java -jar bundletool.jar version

      - uses: actions/upload-artifact@v4
        with:
          name: Werkers-Simson-V4.12.0-PackageFix-${{ github.run_number }}
          path: android-store-project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: bundletool-1.18.3-${{ github.run_number }}
          path: bundletool.jar
          if-no-files-found: error
          retention-days: 7
