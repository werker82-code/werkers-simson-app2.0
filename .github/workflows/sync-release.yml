name: Sync Release Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-version.json'
      - 'scripts/prepare_release.py'
      - '.github/workflows/sync-release.yml'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Zentrale Version in Web und Android-Metadaten übernehmen
        run: python3 scripts/prepare_release.py --repo

      - name: Änderungen prüfen
        run: git diff --check

      - name: Synchronisierten Stand committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html www/version.js www/sw.js android-store-project/app/build.gradle
          if git diff --cached --quiet; then
            echo "Release-Metadaten sind bereits synchron."
          else
            git commit -m "Sync app release metadata from app-version.json"
            git push
          fi
