name: Refine S51 GLB 4.4 Body Cockpit

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refine_glb44_body_controls.py'
      - '.github/glb44-trigger'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GLB 4.4 components
        run: python3 scripts/refine_glb44_body_controls.py

      - name: Verify components and integration
        run: |
          test -f assets/models/seat_standard.glb
          test -f assets/models/seat_flat.glb
          test -f assets/models/seat_sport.glb
          test -f assets/models/handlebar_street.glb
          test -f assets/models/handlebar_enduro.glb
          test -f assets/models/handlebar_cross.glb
          test -f assets/models/cockpit.glb
          test -f assets/models/headlight_shell.glb
          test -f assets/models/headlight_classic.glb
          test -f assets/models/headlight_h4.glb
          test -f assets/models/headlight_led.glb
          test -f assets/models/indicators_front.glb
          test -f assets/models/indicators_rear.glb
          test -f assets/models/taillight.glb
          test -f assets/models/front_fender_classic.glb
          test -f assets/models/front_fender_enduro.glb
          test -f assets/models/rear_fender.glb
          test -f www/assets/models/seat_standard.glb
          grep -q "GLB 4.4" configurator3d.js
          grep -q "glbSeatStandard" configurator3d.js
          grep -q "glbHandlebarEnduro" configurator3d.js
          grep -q "glbHeadlightLed" configurator3d.js
          grep -q "glbFrontFenderEnduro" configurator3d.js
          grep -q "configurator-glb4-4" sw.js
          cmp -s configurator3d.js www/configurator3d.js
          cmp -s assets/models/manifest.json www/assets/models/manifest.json

      - name: Commit GLB 4.4 refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models www/assets/models configurator3d.js www/configurator3d.js configurator3d.css www/configurator3d.css sw.js www/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Refine S51 body and cockpit to GLB 4.4'
          git push
